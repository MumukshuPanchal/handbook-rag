name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit, with the release named in the comment,
      # so a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing

  # Scores the default retriever with the real models on a slice of the handbook, and
  # fails if a score falls below the minimums in evals/gate.json. See docs/evaluation.md.
  retrieval-gate:
    name: Retrieval gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # The handbook is not stored in this repository. It is downloaded at the pinned
      # commit and cached, under a key that changes when the pin or the download code
      # changes. A cache is shared with other branches once a run on main has saved it.
      - name: Read the pinned handbook commit
        id: pin
        run: |
          commit=$(uv run python -c "from handbook_rag.config import get_settings; print(get_settings().handbook_commit)")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Restore the handbook snapshot
        id: handbook
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/handbook
          key: handbook-${{ steps.pin.outputs.commit }}-${{ hashFiles('src/handbook_rag/ingest/snapshot.py') }}

      - name: Download the handbook snapshot
        if: steps.handbook.outputs.cache-hit != 'true'
        run: uv run handbook-rag snapshot

      - name: Keep the keyword model next to the others
        run: echo "FASTEMBED_CACHE_PATH=$HOME/.cache/fastembed" >> "$GITHUB_ENV"

      - name: Restore the models
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/fastembed
          key: models-${{ hashFiles('src/handbook_rag/config.py', 'uv.lock', '.github/workflows/ci.yml') }}

      # With the model files restored the gate step fetches nothing, so it cannot fail
      # because the model hub is slow or down. The key includes this file, so a model
      # chosen here by an environment variable starts from a cold cache, online.
      - name: Work offline when the models are restored
        if: steps.models.outputs.cache-hit == 'true'
        run: echo "HF_HUB_OFFLINE=1" >> "$GITHUB_ENV"

      - name: Retrieval gate
        run: uv run handbook-rag eval-gate

  # Builds the container image, so a change to the Dockerfile or the dependencies that
  # breaks it is caught here and not by the next person who runs `docker compose up`.
  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build --tag handbook-rag:ci .

      - name: Check that the image runs, and not as root
        run: |
          docker run --rm handbook-rag:ci handbook-rag --version
          test "$(docker run --rm handbook-rag:ci id -u)" != "0"
