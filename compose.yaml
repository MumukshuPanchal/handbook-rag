# Local services. `make qdrant` starts the vector store, `make traces` the trace backend.
name: handbook-rag

services:
  qdrant:
    image: qdrant/qdrant:v1.20.2
    # Qdrant has no authentication by default, so it listens on this machine only.
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Receives traces over OTLP and shows them in a web page at http://localhost:16686.
  # It keeps them in memory, so they are gone when the container stops.
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    # No authentication, so it listens on this machine only.
    ports:
      - "127.0.0.1:16686:16686" # web page
      - "127.0.0.1:4318:4318" # OTLP over HTTP, where the application sends spans
    restart: unless-stopped

volumes:
  qdrant-data:
