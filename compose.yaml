# Local services. `make qdrant` starts the vector store.
name: handbook-rag

services:
  qdrant:
    image: qdrant/qdrant:v1.20.2
    # Qdrant has no authentication by default, so it listens on this machine only.
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  qdrant-data:
