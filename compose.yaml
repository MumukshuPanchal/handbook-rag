# The whole system: `docker compose up` starts the API, the vector store and the trace
# backend. `make qdrant` and `make traces` start one service each, for development
# with the API running outside Docker.
name: handbook-rag

services:
  # The HTTP API. It starts without an index: /health then answers 503 and says the
  # index has not been built. Build it with:
  #   docker compose run --rm api handbook-rag snapshot
  #   docker compose run --rm api handbook-rag index
  # The application inside the container does not read a .env file. It runs with the
  # default settings plus the ones listed here; add a line to change another.
  #
  # One value does come from the project's .env file: the Gemini API key, which /ask
  # needs. Compose reads .env itself to fill in ${GEMINI_API_KEY} below, so the key is
  # written neither in this file nor in the image (.dockerignore keeps .env out of the
  # build). Without it the API starts anyway, searches work, and /ask answers 503.
  # Note that `docker compose config` prints the file with the key filled in, in clear
  # text, and so does `docker inspect` on the running container. Do not paste either.
  api:
    build: .
    image: handbook-rag:local
    # The image exists only on this machine, so there is nothing to pull.
    pull_policy: build
    # A small init process passes signals on, so a one-off command such as indexing
    # stops when it is told to.
    init: true
    environment:
      HANDBOOK_RAG_QDRANT_URL: http://qdrant:6333
      HANDBOOK_RAG_TRACING: "true"
      HANDBOOK_RAG_OTLP_ENDPOINT: http://jaeger:4318
      # The answer cache, in the mode that is also the default outside Docker (ADR 0020):
      # an answer stored earlier is served again to the same question, and to one that a
      # second model judges to mean the same. With a key in .env, the first start
      # downloads that model with the others into the model-cache volume (552 MiB on
      # disk when measured on the development laptop), and the container holds it in
      # memory. If it cannot be downloaded, the API does not start, and its log says
      # which setting to change. Without a key no cache is built and nothing more is
      # downloaded. Set it to exact for the same question only, with no third model,
      # or to off.
      HANDBOOK_RAG_CACHE_MODE: semantic
      # Empty when .env has no key, which the application treats as no key.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    # No authentication, so it is published on this machine only.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - handbook-data:/app/data # the handbook snapshot
      - model-cache:/home/app/.cache # model files, downloaded on first start
    depends_on:
      qdrant:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      # Is the server up and accepting connections? Whether it can answer a search is a
      # different question, which GET /health answers: that depends on the index, and
      # a container that is waiting for its index is not broken.
      # Python is in the image; curl is not.
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"
      interval: 10s
      timeout: 5s
      retries: 6
      # The first start downloads the models, which takes a while: the embedding
      # model, and with a key in .env the answer cache's second model, 552 MiB more.
      # Ten minutes allow for a slow line. How long the download takes in a container
      # was not measured.
      start_period: 600s
    # No restart policy, unlike the two services below: the API holds port 8000, which
    # `make serve` also wants, so it should not come back by itself.

  qdrant:
    image: qdrant/qdrant:v1.20.2
    # Qdrant has no authentication by default, so it listens on this machine only.
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Receives traces over OTLP and shows them in a web page at http://localhost:16686.
  # It keeps them in memory, so they are gone when the container stops. The image has no
  # shell to run a health check with, so `make traces` returns when the container is
  # running, a moment before it accepts spans.
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    # No authentication, so it listens on this machine only.
    ports:
      - "127.0.0.1:16686:16686" # web page
      - "127.0.0.1:4318:4318" # OTLP over HTTP, where the application sends spans
    restart: unless-stopped

volumes:
  qdrant-data:
  handbook-data:
  model-cache:
