[project]
name = "handbook-rag"
version = "0.1.0"
description = "A knowledge assistant that answers questions from a company handbook with cited, evaluated answers."
readme = "README.md"
authors = [{ name = "Mumukshu Panchal" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "markdown-it-py>=4.3.0",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.3.0",
    "tokenizers>=0.23.3",
    "torch>=2.15.0",
    "typer>=0.29.2",
]

[project.scripts]
handbook-rag = "handbook_rag.cli:app"

# PyTorch publishes CPU-only builds on its own index. Linux machines (CI and containers)
# use them, which avoids downloading several gigabytes of GPU libraries they cannot use.
# macOS gets the default build, which includes Apple GPU support.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: style, F: pyflakes, I: import order, UP: modern syntax, B: likely bugs,
# SIM: simplifications, C4: comprehensions, PT: pytest style, RUF: ruff's own rules.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PT", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests download a model. They are skipped by default: run them with `make test-slow`.
addopts = "-ra --strict-markers --strict-config -m 'not slow'"
markers = ["slow: downloads a model or needs a running service"]
filterwarnings = [
    # Tests use Qdrant's embedded mode, where payload indexes are accepted but unused.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
    # Raised on purpose by the test that points the client at an address nothing listens on.
    "ignore:Failed to obtain server version:UserWarning",
]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["handbook_rag"]
branch = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261113",
]
